# Copy to deploy/secrets.yml (git-ignored) and fill in before deploying.
# Do not use quotes (' or ") inside the values.

# Login for the dashboard and Grafana (HTTP basic auth over HTTPS).
dashboard_user: admin
dashboard_password: change-me-to-a-long-password

# Grafana's own admin password (Grafana is behind the same login anyway).
grafana_password: change-me-to-another-long-password

# Optional: your own domain whose DNS points at the server.
# Leave empty to use <server-ip>.sslip.io (free, works with HTTPS).
domain: ""

# Optional gen-AI features. Set a monthly spending limit on the key first.
openai_api_key: ""
openai_model: gpt-4o-mini
