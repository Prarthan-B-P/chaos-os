server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
