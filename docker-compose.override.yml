# Local-only: publish lab ports on the host and run the Evidence Dashboard.
# Loaded automatically by `docker compose`; CI skips it (COMPOSE_FILE=docker-compose.yml).
services:
  frontend:
    ports:
      - "8080:80"
  api:
    ports:
      - "8000:8000"
  toxiproxy:
    ports:
      - "8474:8474"   # Toxiproxy control API
  prometheus:
    ports:
      - "9090:9090"
  grafana:
    ports:
      - "3000:3000"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8090:8090"
    environment:
      LAB_PROJECT: ${COMPOSE_PROJECT_NAME:-chaosos}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - results:/results
    depends_on:
      api:
        condition: service_healthy
