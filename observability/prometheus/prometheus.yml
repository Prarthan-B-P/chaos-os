global:
  # 5s instead of the usual 15s: recovery events are short.
  scrape_interval: 5s
  evaluation_interval: 5s

# SLO recording rules and burn-rate alerts (tested in tests/slo_test.yml).
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # Synthetic users: the client-side SLI the alerts are built on.
  - job_name: traffic
    static_configs:
      - targets: ["traffic:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
