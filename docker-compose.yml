# CHAOS OS lab: the target application plus its observability stack.
# All config is baked into images (no bind mounts) so Jenkins can run this
# file through the host Docker socket.
#
# Host ports live in docker-compose.override.yml, which `docker compose` loads
# automatically for local use. CI sets COMPOSE_FILE=docker-compose.yml to skip
# it, so a CI copy of the lab never clashes with a local one.
name: chaosos

services:
  frontend:
    build: ./app/frontend
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./app/api
    environment:
      # Dependencies are reached through Toxiproxy so faults can be injected.
      DATABASE_URL: postgresql://shop:shop@toxiproxy:15432/shop
      REDIS_HOST: toxiproxy
      REDIS_PORT: "16379"
    depends_on:
      toxiproxy:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    build: ./app/db
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 2s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  toxiproxy:
    build: ./chaos/toxiproxy
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]

  prometheus:
    build: ./observability/prometheus

  grafana:
    build: ./observability/grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus

  # On-demand tools (profile "tools"), not started by `up`:
  #   docker compose run --rm --build controller run --scenario redis_down --action all
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    profiles: ["tools"]
    environment:
      LAB_PROJECT: ${COMPOSE_PROJECT_NAME:-chaosos}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - results:/results

  #   docker compose run --rm --build ansible playbooks/<name>.yml -e ...
  ansible:
    build: ./ansible
    profiles: ["tools"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  results:
